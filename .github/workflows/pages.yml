name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      # GitHub listet das Paket manchmal erst mit Verzögerung – kurz warten
      - run: sleep 15
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
